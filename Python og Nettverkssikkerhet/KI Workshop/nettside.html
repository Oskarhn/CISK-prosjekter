<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notflix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #141414;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    /* NAVBAR */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      position: fixed;
      top: 0;
      width: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      z-index: 100;
    }

    .logo {
      color: #E50914;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .sign-in-btn {
      background: #E50914;
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }

    .sign-in-btn:hover { background: #f40612; }

    /* HERO */
    .hero {
      height: 100vh;
      background: linear-gradient(to right, rgba(0,0,0,0.8) 40%, transparent),
                  linear-gradient(to top, #141414 5%, transparent 50%),
                  url('https://picsum.photos/1600/900?random=1') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 4rem;
    }

    .hero h1 {
      font-size: 3rem;
      max-width: 600px;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 500px;
      color: #ccc;
      margin-bottom: 1.5rem;
    }

    .hero-buttons { display: flex; gap: 1rem; }

    .btn-play {
      background: white;
      color: black;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-info {
      background: rgba(109,109,110,0.7);
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    /* CONTENT ROWS */
    .content { padding: 2rem; }

    .row { margin-bottom: 2rem; }

    .row h2 {
      font-size: 1.3rem;
      margin-bottom: 0.8rem;
      color: #e5e5e5;
    }

    .cards {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .cards::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 200px;
      height: 120px;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .card:hover { transform: scale(1.05); }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* LOGIN MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: rgba(0,0,0,0.85);
      border: 1px solid #444;
      padding: 2.5rem;
      border-radius: 8px;
      width: 350px;
    }

    .modal h2 { margin-bottom: 1.5rem; font-size: 1.8rem; }

    .modal input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      background: #333;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 1rem;
    }

    .modal .submit-btn {
      width: 100%;
      background: #E50914;
      color: white;
      border: none;
      padding: 0.9rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .modal .close-btn {
      float: right;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <nav>
    <span class="logo">NOTFLIX</span>
    <button class="sign-in-btn" onclick="openModal()">Logg inn</button>
  </nav>

  <div class="hero">
    <h1>Ubegrenset underholdning</h1>
    <p>Se filmer, serier og mer. Ingen bindingstid.</p>
    <div class="hero-buttons">
      <button class="btn-play">▶ Spill av</button>
      <button class="btn-info">ℹ Mer info</button>
    </div>
  </div>

  <div class="content">
    <div class="row">
      <h2>Populært nå</h2>
      <div class="cards">
        <div class="card"><img src="https://picsum.photos/200/120?random=2" alt="Film 1"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=3" alt="Film 2"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=4" alt="Film 3"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=5" alt="Film 4"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=6" alt="Film 5"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=7" alt="Film 6"></div>
      </div>
    </div>

    <div class="row">
      <h2>Topp serier</h2>
      <div class="cards">
        <div class="card"><img src="https://picsum.photos/200/120?random=8" alt="Serie 1"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=9" alt="Serie 2"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=10" alt="Serie 3"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=11" alt="Serie 4"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=12" alt="Serie 5"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=13" alt="Serie 6"></div>
      </div>
    </div>

    <div class="row">
      <h2>Nye utgivelser</h2>
      <div class="cards">
        <div class="card"><img src="https://picsum.photos/200/120?random=14" alt="Ny 1"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=15" alt="Ny 2"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=16" alt="Ny 3"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=17" alt="Ny 4"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=18" alt="Ny 5"></div>
        <div class="card"><img src="https://picsum.photos/200/120?random=19" alt="Ny 6"></div>
      </div>
    </div>
  </div>

  <!-- LOGIN MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeOnOverlay(event)">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h2>Logg inn</h2>
      <input type="email" placeholder="E-postadresse" id="emailInput">
      <input type="password" placeholder="Passord" id="passwordInput">
      <button class="submit-btn" onclick="login()">Logg inn</button>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function closeOnOverlay(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    function login() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      if (email && password) {
        closeModal();
        alert('Innlogget som ' + email);
      } else {
        alert('Fyll inn e-post og passord.');
      }
    }
  </script>

</body>
</html>
