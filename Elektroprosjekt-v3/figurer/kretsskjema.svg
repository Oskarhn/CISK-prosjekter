<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="100%" height="100%">
  <defs>
    <style>
      .wire { stroke: #1a1a1a; stroke-width: 2.5; fill: none; }
      .wire-dash { stroke: #6a3; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .cap-plate { fill: none; stroke: #1a1a1a; stroke-width: 2; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #1a1a1a; }
      .val { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #555; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1a1a1a; }
      .box { fill: #f7f7f7; stroke: #1a1a1a; stroke-width: 1.5; rx: 4;}
      .box-hv { fill: #fff7e6; stroke: #b96a00; stroke-width: 1.5; rx: 4;}
      .box-hv2 { fill: #ffe6d9; stroke: #b93a00; stroke-width: 1.5; rx: 4;}
      .net { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #888; font-style: italic; }
      .netlab { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #333; font-weight: bold; }
      .section { fill: none; stroke: #888; stroke-width: 1.5; stroke-dasharray: 8 4; rx: 6;}
      .sec-lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #555; font-weight: bold; }
      .danger { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #b93a00; font-weight: bold; }
    </style>
  </defs>

  <rect x="10" y="10" width="1080" height="880" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text class="title" x="550" y="42" text-anchor="middle">KONTROLLKRETSEN — V3-HIGHPOWER</text>
  <text class="val" x="550" y="66" text-anchor="middle">Arduino Nano + 2 reed relé i serie (15 kV) + interlock — kun lav-nivå + 8 kV tap på PCB-en</text>
  <text class="danger" x="550" y="86" text-anchor="middle">VIKTIG: 2× DAT70510-HR i serie = 15 kV (sikkert for 8 kV Marx)</text>

  <!-- ================= 1. ARDUINO NANO ================= -->
  <rect class="section" x="30" y="110" width="240" height="380"/>
  <text class="sec-lbl" x="40" y="125">1. ARDUINO NANO (U1)</text>
  <rect class="box" x="50" y="145" width="200" height="320" rx="4"/>
  <text class="lbl" x="60" y="165">Nano</text>
  <text class="val" x="60" y="180">Arduino</text>
  <!-- pin labels (right side of box, x=250 is the right edge) -->
  <line class="wire" x1="250" y1="210" x2="330" y2="210"/>
  <text class="netlab" x="335" y="215">TRIGGER (2)</text>
  <line class="wire" x1="250" y1="240" x2="330" y2="240"/>
  <text class="netlab" x="335" y="245">CHARGE (3)</text>
  <line class="wire" x1="250" y1="270" x2="330" y2="270"/>
  <text class="netlab" x="335" y="275">LED KLAR (4)</text>
  <line class="wire" x1="250" y1="300" x2="330" y2="300"/>
  <text class="netlab" x="335" y="305">LED LADET (5)</text>
  <line class="wire" x1="250" y1="330" x2="330" y2="330"/>
  <text class="netlab" x="335" y="335">INTERLOCK (6)</text>
  <line class="wire" x1="250" y1="360" x2="330" y2="360"/>
  <text class="netlab" x="335" y="365">A0 (mål)</text>

  <!-- 5V and GND nets -->
  <line class="wire" x1="250" y1="390" x2="330" y2="390"/>
  <text class="netlab" x="335" y="395">5V</text>
  <line class="wire" x1="250" y1="410" x2="330" y2="410"/>
  <text class="netlab" x="335" y="415">GND</text>

  <!-- ================= 2. DRIVER (Q1 + R3) ================= -->
  <rect class="section" x="280" y="180" width="270" height="230"/>
  <text class="sec-lbl" x="290" y="195">2. DRIVER</text>
  <!-- R3 base resistor -->
  <line class="wire" x1="330" y1="210" x2="380" y2="210"/>
  <line class="wire" x1="380" y1="210" x2="410" y2="210"/>
  <text class="val" x="372" y="200">R3</text>
  <text class="val" x="372" y="225">1 kΩ</text>
  <!-- Q1 transistor -->
  <text class="lbl" x="420" y="245">Q1</text>
  <text class="val" x="420" y="260">2N2222</text>
  <line class="wire" x1="410" y1="210" x2="455" y2="210"/>
  <line class="wire" x1="455" y1="210" x2="455" y2="340"/>
  <line class="wire" x1="510" y1="210" x2="510" y2="340"/>
  <line class="wire" x1="510" y1="340" x2="560" y2="340"/>
  <line class="wire" x1="510" y1="340" x2="510" y2="370"/>
  <text class="net" x="515" y="385">GND</text>
  <line class="wire" x1="455" y1="340" x2="650" y2="340"/>
  <text class="val" x="555" y="355">K1+K2 spole (56Ω)</text>

  <!-- ================= 3. REED RELÉER (2 i SERIE) ================= -->
  <rect class="section" x="590" y="180" width="270" height="430"/>
  <text class="sec-lbl" x="600" y="195">3. REED RELÉER (2 I SERIE!)</text>
  <!-- K1 -->
  <rect class="box-hv" x="610" y="220" width="230" height="70" rx="4"/>
  <text class="lbl" x="620" y="240">K1 (RELÉ A)</text>
  <text class="val" x="620" y="255">DAT70510-HR (7.5kV)</text>
  <text class="val" x="620" y="270">Spole 28Ω</text>
  <rect class="box-hv" x="610" y="310" width="230" height="70" rx="4"/>
  <text class="lbl" x="620" y="330">K2 (RELÉ B)</text>
  <text class="val" x="620" y="345">DAT70510-HR (7.5kV)</text>
  <text class="val" x="620" y="360">Spole 28Ω</text>
  <!-- relay coil connections to 5V -->
  <line class="wire" x1="610" y1="245" x2="560" y2="245"/>
  <line class="wire" x1="560" y1="245" x2="560" y2="340"/>
  <text class="val" x="460" y="245">Spole 28Ω</text>
  <!-- coil to 5V net -->
  <line class="wire" x1="840" y1="375" x2="890" y2="375"/>
  <line class="wire" x1="890" y1="375" x2="890" y2="390"/>
  <text class="netlab" x="900" y="395">5V (NET)</text>

  <!-- K1 contact to K2 (series) -->
  <line class="wire" x1="725" y1="290" x2="725" y2="310"/>
  <text class="net" x="620" y="300">15kV total (sikker for 8kV)</text>

  <!-- K2 contact to Trigger/HV -->
  <line class="wire" x1="725" y1="380" x2="725" y2="470"/>
  <line class="wire" x1="725" y1="470" x2="890" y2="470"/>
  <text class="netlab" x="740" y="458">TRIGGER (HV)</text>
  <text class="val" x="740" y="445">15kV isolasjon</text>

  <!-- C_trig -->
  <rect class="box-hv2" x="900" y="440" width="180" height="80" rx="4"/>
  <text class="lbl" x="910" y="460">Trigger Marx</text>
  <text class="val" x="910" y="475">C_trig (150µF/450V)</text>
  <text class="val" x="910" y="490">→ Marx 10-steg</text>
  <line class="wire" x1="900" y1="470" x2="890" y2="470"/>
  <line class="wire" x1="900" y1="510" x2="890" y2="510"/>
  <text class="net" x="895" y="525">→ 8kV</text>
  <line class="wire" x1="890" y1="470" x2="890" y2="560"/>
  <line class="wire" x1="890" y1="560" x2="960" y2="560"/>
  <text class="netlab" x="965" y="565">MARX (8kV)</text>
  <line class="wire" x1="960" y1="560" x2="960" y2="620"/>
  <text class="netlab" x="965" y="635">Peaking → TEM</text>

  <!-- 15kV isolation between LV and HV -->
  <rect class="section" x="900" y="180" width="180" height="240"/>
  <text class="sec-lbl" x="910" y="195">15kV ISO</text>
  <rect class="box-hv2" x="910" y="230" width="160" height="150" rx="4"/>
  <text class="lbl" x="920" y="255">Isolasjon</text>
  <text class="val" x="920" y="272">15 kV</text>
  <text class="val" x="920" y="287">mellan LV</text>
  <text class="val" x="920" y="302">og Marx</text>

  <!-- ================= 4. SIKKERHET / INTERLOCK ================= -->
  <rect class="section" x="30" y="500" width="430" height="370"/>
  <text class="sec-lbl" x="40" y="515">4. SIKKERHET + INTERLOCK</text>

  <!-- Nødstopp S1 (NC) -->
  <rect class="box" x="50" y="540" width="200" height="60" rx="4"/>
  <text class="lbl" x="60" y="560">S1 — NØDSTOPP (NC)</text>
  <text class="val" x="60" y="575">Tangen-knapp</text>
  <!-- wire from interlock pin 330 down to S1 -->
  <line class="wire" x1="330" y1="330" x2="330" y2="540"/>
  <line class="wire" x1="330" y1="540" x2="250" y2="540"/>

  <!-- Dør-interlock S2 (NC) -->
  <rect class="box" x="50" y="610" width="200" height="60" rx="4"/>
  <text class="lbl" x="60" y="630">S2 — DØR-INTERLOCK (NC)</text>
  <text class="val" x="60" y="645">Kabinett-dør</text>
  <!-- wire S1/S2 to GND -->
  <line class="wire" x1="250" y1="540" x2="250" y2="640"/>
  <line class="wire" x1="250" y1="640" x2="250" y2="680"/>
  <line class="wire" x1="250" y1="680" x2="330" y2="680"/>
  <line class="wire" x1="330" y1="680" x2="330" y2="410"/>
  <text class="netlab" x="340" y="695">GND (NET)</text>

  <!-- Fjernstyrt triggering -->
  <text class="val" x="40" y="695">Fjernstyrt triggering (hold avstand >5m ved trigger)</text>
  <text class="val" x="40" y="710">Interlock må være HIGH (lukket) for trigger.</text>

  <!-- ================= 5. LEDER + DELER ================= -->
  <rect class="section" x="490" y="600" width="580" height="260"/>
  <text class="sec-lbl" x="500" y="615">5. LEDER + SPENNINGSDEL</text>

  <!-- "Ladet" LED (rød) -->
  <rect class="box" x="510" y="640" width="260" height="70" rx="4"/>
  <text class="lbl" x="520" y="660">Ladet-indikator (RED)</text>
  <text class="val" x="520" y="675">Via spenningsdeler 1000:1</text>
  <text class="val" x="520" y="690">10MΩ + 10kΩ → A0</text>
  <!-- wire from LED LED (5) -->
  <line class="wire" x1="330" y1="300" x2="510" y2="300"/>
  <line class="wire" x1="510" y1="300" x2="510" y2="640"/>
  <text class="netlab" x="345" y="290">5V + R 1kΩ</text>

  <!-- "Klar" LED (grønn) -->
  <rect class="box" x="800" y="640" width="250" height="70" rx="4"/>
  <text class="lbl" x="810" y="660">Klar-indikator (GRØN)</text>
  <text class="val" x="810" y="675">Ved lading</text>
  <line class="wire" x1="330" y1="270" x2="800" y2="270"/>
  <line class="wire" x1="800" y1="270" x2="800" y2="640"/>

  <!-- Spenningsdel for måling -->
  <rect class="box" x="510" y="725" width="260" height="90" rx="4"/>
  <text class="lbl" x="520" y="745">SPENNINGSDEL 1000:1</text>
  <text class="val" x="520" y="760">R6 = 10MΩ + R7 = 10kΩ</text>
  <text class="val" x="520" y="775">→ Arduino A0</text>
  <text class="danger" x="520" y="805">ADVARSEL: Deler må tåle 8kV!</text>
  <!-- HV+ from trigger to divider -->
  <line class="wire" x1="960" y1="560" x2="960" y2="520"/>
  <line class="wire" x1="960" y1="520" x2="770" y2="520"/>

  <!-- GND reference for divider -->
  <line class="wire" x1="510" y1="815" x2="800" y2="815"/>
  <text class="netlab" x="810" y="830">GND (NET)</text>
  <line class="wire" x1="800" y1="830" x2="800" y2="700"/>

  <!-- 5V net line -->
  <text class="netlab" x="620" y="890">5V (NET)</text>
  <line class="wire" x1="620" y1="875" x2="800" y2="875"/>
</svg>
